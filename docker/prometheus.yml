global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ─── NEXUS API ──────────────────────────────────────────
  - job_name: "nexus-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "nexus-api"
          env: "dev"

  # ─── Prometheus self-monitoring ─────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
