[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS — End-to-End AI Platform for real-time content moderation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Cache
    "redis[hiredis]>=5.0.0",
    # ML
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    # MLOps
    "mlflow>=2.16.0",
    "boto3>=1.35.0",
    "prometheus-client>=0.20.0",
    "optuna>=3.6.0",
    # Utils
    "python-json-logger>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "types-redis>=4.6.0",
    "aiosqlite>=0.20.0",  # in-memory SQLite for tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is the standard pattern
]

[tool.ruff.lint.per-file-ignores]
# ML code uses uppercase X for feature matrices and lowercase l for labels
"src/nexus/training/pipeline.py" = ["N803", "N806", "E741"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require external services)",
]

[tool.coverage.run]
source = ["src/nexus"]
omit = ["tests/*"]
